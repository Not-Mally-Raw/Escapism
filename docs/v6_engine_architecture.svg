      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; fill: #888888; font-size: 13px; }
      .card-bg { fill: #111111; stroke-width: 1.5px; }
      .cylinder-num { font-family: 'SF Mono', Menlo, Consolas, monospace; font-weight: 800; font-size: 15px; text-anchor: middle; dominant-baseline: central; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #FFFFFF; letter-spacing: -0.2px; }
      .card-file { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #777777; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 12.5px; fill: #CCCCCC; }
      .card-metric-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9.5px; font-weight: 700; fill: #777777; text-transform: uppercase; letter-spacing: 0.5px; }
      .card-metric-val { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 700; }
      .conn-line { stroke: #262626; stroke-width: 2px; stroke-dasharray: 4,4; }
      .conn-pill { fill: #141414; stroke: #333333; stroke-width: 1px; rx: 10px; ry: 10px; }
      .conn-text { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 600; fill: #FF6600; text-anchor: middle; dominant-baseline: central; }
