      <circle cx="2" cy="29" r="2" fill="#00BFFF"/>
      <text x="12" y="33" class="card-body"><tspan font-weight="700" fill="#FFFFFF">Tier 2 Missing Text Gate:</tspan> Unannotated ambiguous declines (U19/U30) bypass LLM with tau=0.0 to prevent hallucinations</text>
      <circle cx="2" cy="48" r="2" fill="#00BFFF"/>
      <text x="12" y="52" class="card-body"><tspan font-weight="700" fill="#FFFFFF">Tier 3 LLM Semantic Extraction:</tspan> OWASP LLM01:2025 hardened, PII-stripped, Pydantic schema-locked (tau &gt;= 0.40)</text>
      <circle cx="2" cy="67" r="2" fill="#00BFFF"/>
      <text x="12" y="71" class="card-body"><tspan font-weight="700" fill="#FFFFFF">Fail-Closed Invariant:</tspan> Any timeout, parse error, or uncatalogued bank code immediately routes to <tspan font-family="monospace" fill="#FFB300">ESCALATE_HUMAN</tspan></text>
    </g>
  </g>

