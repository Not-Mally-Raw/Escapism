      <text x="12" y="71" class="card-body"><tspan font-weight="700" fill="#FFFFFF">COMPLIANCE WALL:</tspan> Non-compliant actions permanently deleted from A_feasible before scoring -&gt; <tspan font-weight="700" fill="#FFFFFF">CVR = 0.000%</tspan></text>
