      <circle cx="2" cy="48" r="2" fill="#FF6600"/>
      <text x="12" y="52" class="card-body">Durable SQLite <tspan font-family="monospace" fill="#FFB300">inbox</tspan> insertion (WAL mode, retry_count=0, status=PENDING) before thread handoff</text>
